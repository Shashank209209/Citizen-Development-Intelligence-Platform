version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - cdip-db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/citizen_dev_intel.db
      - SECRET_KEY=${SECRET_KEY:-brics-dpg-prototype-dev-key-change-in-prod}
    command: >
      sh -c "python backend/database/seed.py && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  cdip-db:
